<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GARD 구독자 앱</title><link rel="stylesheet" href="style.css"></head><body><header><h1>GARD / 구독자 검수 앱</h1><p>승인된 개별 전달 파일 · 로컬 복호화 · 실사 질문</p></header><main><section><nav><a href="index.html">공개 전시장</a><a href="subscriber.html">구독자 앱</a></nav><h2>제공 파일 열기</h2><label class="field">오너가 별도로 전달한 암호화 JSON<input id="file" type="file" accept=".json"></label><label class="field">별도 전달 암호<input id="password" type="password" autocomplete="off"></label><div class="tools"><button id="open" class="primary">복호화 및 열람</button><button id="close">자료 닫기</button></div><p id="message" role="status">파일을 선택하세요.</p><small>파일과 암호는 서버에 전송하지 않으며 열람 내용은 브라우저 메모리에만 유지됩니다. 별도의 로그인/신원 인증 기능은 아닙니다.</small></section><section id="content" hidden><h2 id="recipient"></h2><div id="rows"></div><h2>실사 질문 생성</h2><label class="field">검토 자산<select id="asset"></select></label><label class="field">질문 및 검수 의견<textarea id="question"></textarea></label><button id="export" class="primary">질문 JSON 내려받기</button><p class="muted">생성한 질문 파일은 이메일 등 별도 채널로 오너에게 전달합니다. 질문 파일은 평문입니다.</p></section></main><script src="common.js"></script><script src="subscriber.js"></script></body></html>
